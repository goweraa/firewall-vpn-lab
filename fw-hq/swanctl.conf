# IKEv2 site-to-site tunnel HQ <-> branch, pre-shared key.
connections {
  hq-branch {
    version = 2
    local_addrs = 203.0.113.10
    remote_addrs = 203.0.113.20
    proposals = aes256-sha256-modp2048          # IKE / phase 1
    dpd_delay = 10s
    local  { auth = psk
             id = hq.lab }
    remote { auth = psk
             id = branch.lab }
    children {
      lan-lan {
        local_ts  = 10.10.1.0/24                # phase 2 traffic selectors
        remote_ts = 10.10.2.0/24
        esp_proposals = aes256gcm16-modp2048    # ESP / phase 2
        start_action = trap                     # bring up on first packet
        dpd_action = trap
      }
    }
  }
}
secrets {
  ike-branch {
    id-1 = hq.lab
    id-2 = branch.lab
    secret = "lab-psk-Kr4k0w-2026"
  }
}
